name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos da API em dia com o contrato OpenAPI
        run: npm run api:types && git diff --exit-code -- src/api/schema.ts
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Testes E2E contra a API real
        run: npm run e2e
        working-directory: web

  e2e-producao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: E2E no build estático servido pela API (CSP ativa e orçamento de desempenho)
        run: npm run e2e
        working-directory: web
        env:
          E2E_PROD: "1"
