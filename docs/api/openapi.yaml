openapi: 3.1.0
info:
  title: Opta API
  version: 1.0.0
  summary: Simulador de regimes tributários na Reforma Tributária do Consumo (2026–2033).
  description: |
    Contrato da API v1, escrito antes da implementação (RNF-03). Simulador educacional: não é consultoria
    tributária. Regras marcadas com ⚠️ nos documentos do projeto dependem de conferência na fonte legal.

    **Convenções**
    - Valores monetários e alíquotas trafegam como **texto decimal** (RNF-02, ADR-0003): dinheiro com
      duas casas (`"1800000.00"`), alíquotas em percentual com quatro casas e sem o sinal `%` (`"8.0800"`).
    - Percentuais de perfil são **inteiros de 0 a 100** (RN-09).
    - Erros seguem Problem Details (RFC 9457), com `code` estável `SIM-nnn` (RNF-07).
    - Nenhum endpoint exige autenticação nesta versão; nenhuma entrada é persistida no servidor (RNF-06).
  license:
    name: Uso educacional
    identifier: LicenseRef-Opta
servers:
  - url: /
    description: Mesma origem do front-end (DEC-15)
tags:
  - name: simulacoes
  - name: premissas
  - name: atividades
  - name: servico
paths:
  /v1/simulacoes:
    post:
      tags: [simulacoes]
      operationId: simular
      summary: Simula os regimes ano a ano e recomenda o melhor (UC-01, RF-01 a RF-03, RF-06)
      description: |
        Calcula Simples Nacional, Simples híbrido e Lucro Presumido de 2026 a 2033. É uma consulta (não altera
        estado no servidor). Regimes que não se aplicam à empresa (por exemplo, receita acima do teto do
        Simples) aparecem em `regimes_indisponiveis`, sem impedir os demais.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulacaoRequest" }
            example:
              cnae: "6201-5/01"
              uf: SP
              receita_bruta_anual: "1800000.00"
              folha_anual: "540000.00"
              perfil_clientes: { b2b_pct: 70 }
              compras_creditaveis_pct: 25
              aliquota_icms_iss: "5.0000"
              regimes: [SIMPLES, SIMPLES_HIBRIDO, LUCRO_PRESUMIDO]
      responses:
        "200":
          description: Resultado por ano e regime, com recomendação explicada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulacaoResponse" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/premissas/aliquotas:
    get:
      tags: [premissas]
      operationId: consultarAliquotas
      summary: Consulta as premissas de alíquotas da transição CBS/IBS (RF-04)
      description: Sem `ano`, devolve todos os anos de 2026 a 2033 em uma só chamada.
      parameters:
        - name: ano
          in: query
          required: false
          schema: { type: integer, minimum: 2026, maximum: 2033 }
      responses:
        "200":
          description: Premissas vigentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PremissasResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/atividades:
    get:
      tags: [atividades]
      operationId: consultarAtividades
      summary: Consulta atividades por CNAE exato ou busca por texto (RF-05)
      description: |
        Informe `cnae` (consulta exata, devolve uma atividade) **ou** `q` (busca por texto ou prefixo de código,
        lista curta paginada para o combobox). Informar os dois, ou nenhum, é erro de validação.
      parameters:
        - name: cnae
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Cnae" }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanho
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Atividade (com `cnae`) ou lista paginada (com `q`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Atividade" }
                  - { $ref: "#/components/schemas/AtividadesPagina" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/versao:
    get:
      tags: [servico]
      operationId: consultarVersao
      summary: Versão do serviço e das premissas (RF-07)
      responses:
        "200":
          description: Versões.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Versao" }
  /v1/health:
    get:
      tags: [servico]
      operationId: consultarSaude
      summary: Saúde do serviço (RF-07)
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
components:
  schemas:
    Cnae:
      type: string
      pattern: '^\d{4}-\d/\d{2}$'
      examples: ["6201-5/01"]
    Dinheiro:
      type: string
      description: Valor em reais com duas casas decimais, como texto (RNF-02).
      pattern: '^-?\d+\.\d{2}$'
      examples: ["1800000.00"]
    Aliquota:
      type: string
      description: Percentual com quatro casas decimais, sem o sinal `%`, como texto.
      pattern: '^\d+\.\d{4}$'
      examples: ["8.0800"]
    Regime:
      type: string
      enum: [SIMPLES, SIMPLES_HIBRIDO, LUCRO_PRESUMIDO]
    PerfilClientes:
      type: object
      additionalProperties: false
      required: [b2b_pct]
      properties:
        b2b_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Parcela das vendas para empresas (B2B); o restante é B2C.
    SimulacaoRequest:
      type: object
      additionalProperties: false
      required: [cnae, uf, receita_bruta_anual, folha_anual, perfil_clientes, compras_creditaveis_pct]
      properties:
        cnae: { $ref: "#/components/schemas/Cnae" }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
        receita_bruta_anual:
          allOf: [{ $ref: "#/components/schemas/Dinheiro" }]
          description: No MVP também é a RBT12 do Simples (RN-04). Não negativa.
        folha_anual:
          allOf: [{ $ref: "#/components/schemas/Dinheiro" }]
          description: Folha dos 12 meses, base do Fator R e da CPP. Não negativa.
        perfil_clientes: { $ref: "#/components/schemas/PerfilClientes" }
        compras_creditaveis_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Compras que geram crédito de CBS/IBS, em % do faturamento.
        aliquota_icms_iss:
          allOf: [{ $ref: "#/components/schemas/Aliquota" }]
          description: Alíquota de ICMS (comércio) ou ISS (serviços) informada; se omitida, assume 5.0000.
        regimes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: "#/components/schemas/Regime" }
          description: Regimes a simular; se omitido, simula os três.
    LinhaTributo:
      type: object
      description: Linha da memória de cálculo auditável (RF-06).
      required: [codigo, base, aliquota, valor, fonte]
      properties:
        codigo:
          type: string
          examples: [DAS, IRPJ, CSLL, CPP, PIS_COFINS, CBS, IBS, ICMS, ISS]
        base: { $ref: "#/components/schemas/Dinheiro" }
        aliquota: { $ref: "#/components/schemas/Aliquota" }
        valor: { $ref: "#/components/schemas/Dinheiro" }
        fonte: { type: string, description: "Fonte legal; pode trazer ⚠️ quando a conferência está pendente." }
        detalhes:
          type: array
          description: Partilha do DAS, débito e crédito, ou IRPJ básico e adicional. Não entram na soma da carga.
          items: { $ref: "#/components/schemas/LinhaTributo" }
    RegimeAno:
      type: object
      required: [regime, carga_total, aliquota_efetiva, tributos]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        carga_total: { $ref: "#/components/schemas/Dinheiro" }
        aliquota_efetiva:
          allOf: [{ $ref: "#/components/schemas/Aliquota" }]
          description: Carga total sobre a receita bruta anual.
        tributos:
          type: array
          items: { $ref: "#/components/schemas/LinhaTributo" }
    AnoResultado:
      type: object
      required: [ano, regimes, melhor_regime]
      properties:
        ano: { type: integer, minimum: 2026, maximum: 2033 }
        regimes:
          type: array
          items: { $ref: "#/components/schemas/RegimeAno" }
        melhor_regime:
          allOf: [{ $ref: "#/components/schemas/Regime" }]
          description: Regime de menor carga no ano (RN-08); empate fica com o primeiro informado.
    FatorDecisivo:
      type: object
      required: [codigo, diferenca]
      properties:
        codigo:
          type: string
          enum: [TRIBUTOS_SOBRE_RENDA, ENCARGOS_SOBRE_FOLHA, TRIBUTOS_SOBRE_CONSUMO, NENHUM]
          description: |
            Categoria em que o segundo colocado paga mais a mais, no horizonte todo: renda (IRPJ e CSLL),
            folha (CPP) ou consumo (CBS, IBS, ICMS, ISS e PIS/Cofins). `NENHUM` quando não há vantagem.
        diferenca: { $ref: "#/components/schemas/Dinheiro" }
    Recomendacao:
      type: object
      required: [regime, motivo, economia_acumulada, fator_decisivo]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        motivo: { type: string, description: Texto em PT-BR com a explicação. }
        economia_acumulada:
          allOf: [{ $ref: "#/components/schemas/Dinheiro" }]
          description: Diferença de carga acumulada em 2026–2033 contra o segundo colocado (RN-08).
        fator_decisivo: { $ref: "#/components/schemas/FatorDecisivo" }
        segundo_colocado:
          oneOf: [{ $ref: "#/components/schemas/Regime" }, { type: "null" }]
    RegimeIndisponivel:
      type: object
      required: [regime, codigo, detalhe]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        codigo: { type: string, pattern: '^SIM-\d{3}$', examples: [SIM-003] }
        detalhe: { type: string }
    SimulacaoResponse:
      type: object
      required: [premissas_versao, anos, recomendacao, regimes_indisponiveis, avisos]
      properties:
        premissas_versao: { type: string, examples: ["2026.1"] }
        anos:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/AnoResultado" }
        recomendacao:
          oneOf: [{ $ref: "#/components/schemas/Recomendacao" }, { type: "null" }]
          description: Nula quando nenhum regime pôde ser calculado.
        regimes_indisponiveis:
          type: array
          items: { $ref: "#/components/schemas/RegimeIndisponivel" }
        avisos:
          type: array
          description: Alertas ⚠️ de legislação e premissas em PT-BR.
          items: { type: string }
    AliquotasAno:
      type: object
      required: [ano, cbs, ibs, icms_iss_vigente_pct, pis_cofins_extinto, ano_de_teste]
      properties:
        ano: { type: integer, minimum: 2026, maximum: 2033 }
        cbs: { $ref: "#/components/schemas/Aliquota" }
        ibs: { $ref: "#/components/schemas/Aliquota" }
        icms_iss_vigente_pct: { type: integer, minimum: 0, maximum: 100 }
        pis_cofins_extinto: { type: boolean }
        ano_de_teste: { type: boolean, description: "Em 2026 a CBS/IBS é de teste e compensada." }
    PremissasResponse:
      type: object
      required: [premissas_versao, anos]
      properties:
        premissas_versao: { type: string }
        anos:
          type: array
          items: { $ref: "#/components/schemas/AliquotasAno" }
    Atividade:
      type: object
      required: [cnae, descricao, natureza, usa_fator_r, presuncao_irpj, presuncao_csll]
      properties:
        cnae: { $ref: "#/components/schemas/Cnae" }
        descricao: { type: string }
        natureza: { type: string, enum: [SERVICO, COMERCIO] }
        anexo_simples:
          type: string
          enum: ["III", "V"]
          description: Anexo sem Fator R; atividades sujeitas ao Fator R informam o Anexo V e `usa_fator_r`.
        usa_fator_r: { type: boolean, description: "Com Fator R de 28% ou mais, passa do Anexo V ao III (RN-05)." }
        presuncao_irpj: { $ref: "#/components/schemas/Aliquota" }
        presuncao_csll: { $ref: "#/components/schemas/Aliquota" }
    AtividadesPagina:
      type: object
      required: [itens, pagina, tem_proxima]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Atividade" }
        pagina: { type: integer, minimum: 1 }
        tem_proxima: { type: boolean }
    Versao:
      type: object
      required: [versao, premissas_versao]
      properties:
        versao: { type: string, examples: ["0.1.0"] }
        premissas_versao: { type: string }
    Saude:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CampoInvalido:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string, description: "Ponteiro JSON do campo (RFC 6901).", examples: ["/receita_bruta_anual"] }
        detail: { type: string }
    Problem:
      type: object
      description: Problem Details (RFC 9457) com código estável e erros por campo.
      required: [type, title, status, code]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          pattern: '^SIM-\d{3}$'
          description: |
            SIM-001 entrada inválida; SIM-002 parâmetros sem vigência para o ano; SIM-003 receita acima do teto
            do Simples; SIM-004 atividade fora do escopo; SIM-005 recurso não encontrado; SIM-006 requisição malformada
            (corpo ausente, JSON inválido ou tipo de conteúdo diferente de application/json); SIM-500 erro interno.
        errors:
          type: array
          description: Erros por campo, presentes nos 422 de validação.
          items: { $ref: "#/components/schemas/CampoInvalido" }
  responses:
    MalformedRequest:
      description: Corpo ausente, JSON malformado ou tipo de conteúdo não suportado.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Entrada inválida (SIM-001, SIM-004) ou parâmetros sem vigência (SIM-002).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Entrada inválida
            status: 422
            code: SIM-001
            detail: Corrija os campos indicados.
            errors:
              - { pointer: /receita_bruta_anual, detail: Receita bruta anual negativa. }
    NotFound:
      description: Atividade não encontrada (SIM-005).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Erro interno (SIM-500), sem detalhes técnicos.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
